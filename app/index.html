<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Financeiro</title>
<meta name="description" content="Controle de gastos e ganhos simples, com gráfico e relatório do mês.">
<meta name="theme-color" content="#512BD4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Financeiro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{
  --primary:#512BD4; --teal:#00A99D; --blue:#1E88E5; --red:#E53935; --green:#2E7D32;
  --orange:#FB8C00; --slate:#607D8B; --dark:#333;
  --bg:#F5F5F5; --card:#FFFFFF; --text:#1F1F1F; --muted:#6B6B6B; --line:#E0E0E0;
  --ok:#2E7D32; --bad:#C62828;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121212; --card:#1E1E1E; --text:#EDEDED; --muted:#A8A8A8; --line:#333;
         --ok:#66BB6A; --bad:#EF5350; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);
     -webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:var(--primary);color:#fff;
       padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px;min-height:56px}
header button{background:none;border:0;color:#fff;font-size:24px;padding:4px 8px;cursor:pointer;line-height:1}
header h1{font-size:18px;margin:0;font-weight:600}
main{max-width:560px;margin:0 auto;padding:20px 16px calc(env(safe-area-inset-bottom) + 32px)}
h2.title{font-size:28px;margin:0 0 16px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.label{color:var(--muted);font-size:14px;margin-bottom:4px}
.big{font-size:28px;font-weight:700}
.red{color:var(--bad)} .green{color:var(--ok)}
.btn{display:block;width:100%;border:0;border-radius:12px;color:#fff;font-size:16px;font-weight:600;
     min-height:52px;margin-bottom:12px;cursor:pointer;padding:0 16px}
.btn:active{opacity:.85}
.btn.teal{background:var(--teal)} .btn.blue{background:var(--blue)} .btn.red{background:var(--red)}
.btn.green{background:var(--green)} .btn.dark{background:var(--dark)} .btn.orange{background:var(--orange)}
.btn.slate{background:var(--slate)}
.btn.outline{background:transparent;color:var(--bad);border:2px solid var(--bad)}
.btn.link{background:none;color:var(--blue);min-height:40px}
.field{display:block;width:100%;font-size:16px;padding:14px;border:1px solid var(--line);border-radius:10px;
       background:var(--card);color:var(--text);margin-bottom:14px;font-family:inherit}
.month{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px}
.month button{background:var(--primary);color:#fff;border:0;border-radius:8px;width:48px;height:40px;font-size:18px;cursor:pointer}
.month span{font-size:18px;font-weight:700;min-width:170px;text-align:center;text-transform:uppercase}
.chart{display:flex;align-items:center;gap:16px;margin-top:12px}
.chart svg{flex:0 0 150px}
.legend{font-size:13px;flex:1;min-width:0}
.legend div{display:flex;align-items:center;gap:6px;margin:4px 0}
.legend i{width:10px;height:10px;border-radius:2px;flex:0 0 10px}
.legend span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.item .cat{font-weight:700;font-size:17px}
.item .desc{color:var(--muted);font-size:13px}
.item .val{font-size:18px;font-weight:700;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.muted{color:var(--muted);font-size:14px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;
       padding:20px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h3{margin:0 0 6px} .sheet p{margin:0 0 16px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);
       background:#323232;color:#fff;padding:12px 18px;border-radius:24px;font-size:15px;z-index:30;max-width:90%}
.logo{display:block;width:96px;height:96px;border-radius:22px;margin:8px auto 12px}
.center{text-align:center}
.tip{background:#FFF8E1;color:#5D4037;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px}
@media (prefers-color-scheme: dark){ .tip{background:#3E3420;color:#FFE0A3} }
/* Relatorio para impressao/PDF */
#report{display:none}
@media print{
  body{background:#fff;color:#000}
  header,main,.sheet-bg,.toast{display:none !important}
  #report{display:block;padding:24px;font-family:Arial,sans-serif;color:#000}
  #report h1{font-size:22px} #report h2{font-size:16px;margin-top:20px}
  #report table{width:100%;border-collapse:collapse;font-size:12px}
  #report td,#report th{border-bottom:1px solid #ccc;padding:6px;text-align:left}
  #report .r{text-align:right}
}
</style>
</head>
<body>
<header id="hdr" hidden>
  <button id="back" aria-label="Voltar" hidden>&#8592;</button>
  <h1 id="hdrTitle">Meu Financeiro</h1>
</header>
<main id="view"></main>
<div id="report"></div>

<script>
'use strict';
/* ================= Dados (ficam só neste aparelho) ================= */
const KEY = 'meufinanceiro.v1';
const CAT_GASTO = ['Alimentação','Transporte','Lazer','Moradia','Saúde','Outros'];
const CAT_GANHO = ['Salário','Freela','Investimentos','Presente','Reembolso','Outros'];
const COL_GASTO = ['#E53935','#FB8C00','#8E24AA','#6D4C41','#D81B60','#757575'];
const COL_GANHO = ['#2E7D32','#00897B','#1E88E5','#43A047','#26A69A','#9E9D24'];

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {users:{},session:null}; }catch(e){ return {users:{},session:null}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('Não foi possível salvar neste navegador.'); } }
let db = load();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

const norm = e => (e||'').trim().toLowerCase();
async function hash(email, pass){
  const data = new TextEncoder().encode('mf:' + norm(email) + ':' + pass);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
const me = () => db.session && db.users[db.session] ? db.users[db.session] : null;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ================= Utilidades ================= */
const brl = v => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ym = d => d.slice(0,7);                       // 'AAAA-MM'
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fmtDate = iso => { const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
function monthLabel(key){ const [y,m]=key.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); }
function shiftMonth(key,n){ const [y,m]=key.split('-').map(Number); const d=new Date(y,m-1+n,1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function parseValor(s){ s=String(s||'').trim().replace(/\s|R\$/g,'');
  if (s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const v=parseFloat(s); return isFinite(v)?Math.round(v*100)/100:NaN; }

let mes = ym(todayISO());
const $ = s => document.querySelector(s);
const view = $('#view');

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }

function sheet(title, text, buttons){
  return new Promise(res=>{
    const bg=document.createElement('div'); bg.className='sheet-bg';
    bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${text?`<p>${esc(text)}</p>`:''}</div>`;
    const sh=bg.firstChild;
    buttons.forEach(b=>{ const el=document.createElement('button'); el.className='btn '+(b.cls||'dark'); el.textContent=b.label;
      el.onclick=()=>{bg.remove();res(b.value);}; sh.appendChild(el); });
    bg.onclick=e=>{ if(e.target===bg){bg.remove();res(null);} };
    document.body.appendChild(bg);
  });
}
const confirmar = (t,x,ok='Confirmar',cls='red') => sheet(t,x,[{label:ok,value:true,cls},{label:'Cancelar',value:false,cls:'slate'}]);

function setHeader(title, back){
  $('#hdr').hidden = false; $('#hdrTitle').textContent = title;
  $('#back').hidden = !back;
}

/* ================= Rotas ================= */
const routes = {};
function go(r){ location.hash = r; }
function render(){
  const r = (location.hash||'#').slice(1) || '';
  if (!me() && !['login','cadastro'].includes(r)) return go('login');
  if (me() && (r==='login'||r==='cadastro'||r==='')) return go('dashboard');
  const [name,arg] = r.split('/');
  (routes[name]||routes.dashboard)(arg);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
$('#back').onclick = () => history.length>1 ? history.back() : go('dashboard');

/* ---------- Login ---------- */
routes.login = () => {
  setHeader('Login', false);
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  view.innerHTML = `
    <img class="logo" src="icon-192.png" alt="">
    <h2 class="title center">Meu Financeiro</h2>
    ${isIOS && !standalone ? `<div class="tip">📲 <b>Instale no iPhone:</b> toque em <b>Compartilhar</b> (□↑) e depois em <b>Adicionar à Tela de Início</b>.</div>`:''}
    <form id="f">
      <input class="field" id="email" type="email" placeholder="E-mail" autocomplete="username" required>
      <input class="field" id="pass" type="password" placeholder="Senha" autocomplete="current-password" required>
      <button class="btn teal">Entrar</button>
    </form>
    <button class="btn blue" onclick="go('cadastro')">Criar conta</button>
    <p class="muted center">Seus dados ficam salvos somente neste aparelho.<br>
    <a href="../privacidade.html">Política de privacidade</a></p>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const u = db.users[norm($('#email').value)];
    if (!u || u.hash !== await hash($('#email').value, $('#pass').value)) return toast('E-mail ou senha inválidos');
    db.session = u.email; save(); go('dashboard');
  };
};

/* ---------- Cadastro ---------- */
routes.cadastro = () => {
  setHeader('Criar conta', true);
  view.innerHTML = `
    <h2 class="title">Criar conta</h2>
    <form id="f">
      <input class="field" id="email" type="email" placeholder="E-mail" autocomplete="username" required>
      <input class="field" id="pass" type="password" placeholder="Senha (mínimo 4 caracteres)" minlength="4" autocomplete="new-password" required>
      <button class="btn teal">Cadastrar</button>
    </form>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const email = norm($('#email').value), pass = $('#pass').value;
    if (!email || pass.length<4) return toast('Informe e-mail e senha.');
    if (db.users[email]) return toast('Este e-mail já está cadastrado.');
    db.users[email] = {email, hash: await hash(email,pass), salario:0, lanc:[]};
    db.session = email; save(); toast('Conta criada!'); go('dashboard');
  };
};

/* ---------- Dashboard ---------- */
function doMes(u, key){ return u.lanc.filter(l=>ym(l.data)===key); }
function totais(u,key){
  const l=doMes(u,key);
  const gastos=l.filter(x=>x.tipo==='Gasto').reduce((s,x)=>s+x.valor,0);
  const ganhos=l.filter(x=>x.tipo==='Ganho').reduce((s,x)=>s+x.valor,0);
  return {gastos, ganhos, disponivel:(u.salario||0)+ganhos-gastos, lanc:l};
}
function donut(items){
  const total=items.reduce((s,i)=>s+i.v,0); if(!total) return '';
  const R=60,C=2*Math.PI*R; let off=0;
  const segs=items.map(i=>{ const len=i.v/total*C; const s=`<circle r="${R}" cx="75" cy="75" fill="none" stroke="${i.c}" stroke-width="26"
     stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`; off+=len; return s; }).join('');
  return `<svg viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="Gráfico por categoria">${segs}</svg>`;
}
routes.dashboard = () => {
  const u=me(); setHeader('Meu Financeiro', false);
  const t=totais(u,mes);
  const agrup={};
  t.lanc.forEach(l=>{ const k=l.tipo+'|'+l.categoria; agrup[k]=(agrup[k]||0)+l.valor; });
  const items=Object.entries(agrup).map(([k,v])=>{ const [tipo,cat]=k.split('|');
    const lista=tipo==='Gasto'?CAT_GASTO:CAT_GANHO, cores=tipo==='Gasto'?COL_GASTO:COL_GANHO;
    return {tipo,cat,v,c:cores[Math.max(0,lista.indexOf(cat))]}; }).sort((a,b)=>b.v-a.v);
  view.innerHTML = `
    <h2 class="title">Dashboard</h2>
    <div class="month"><button id="prev" aria-label="Mês anterior">&#8592;</button>
      <span>${monthLabel(mes)}</span><button id="next" aria-label="Próximo mês">&#8594;</button></div>
    <div class="card"><div class="label">Gastos do mês</div><div class="big red">${brl(t.gastos)}</div></div>
    <div class="card"><div class="label">Disponível para investir</div>
      <div class="big ${t.disponivel>=0?'green':'red'}">${brl(t.disponivel)}</div>
      <div class="muted">Salário ${brl(u.salario)} + ganhos ${brl(t.ganhos)} − gastos ${brl(t.gastos)}</div>
      ${items.length?`<div class="chart">${donut(items)}<div class="legend">${items.map(i=>
        `<div><i style="background:${i.c}"></i><span>${esc(i.cat)}</span><b>${brl(i.v)}</b></div>`).join('')}</div></div>`
        :`<div class="empty">Nenhum lançamento neste mês.</div>`}
    </div>
    <button class="btn red" onclick="go('novo/Gasto')">➖ Adicionar Gasto</button>
    <button class="btn green" onclick="go('novo/Ganho')">➕ Adicionar Ganho</button>
    <button class="btn dark" onclick="go('historico')">Ver Histórico</button>
    <button class="btn orange" id="pdf">Relatório do mês (PDF)</button>
    <button class="btn slate" onclick="go('config')">Configurações</button>
    <button class="btn link" id="sair">Sair</button>`;
  $('#prev').onclick=()=>{mes=shiftMonth(mes,-1);render();};
  $('#next').onclick=()=>{mes=shiftMonth(mes,1);render();};
  $('#pdf').onclick=relatorio;
  $('#sair').onclick=()=>{ db.session=null; save(); go('login'); };
};

/* ---------- Novo / Editar ---------- */
function formLanc(tipo, l){
  const cats = tipo==='Gasto'?CAT_GASTO:CAT_GANHO;
  const dataPadrao = l ? l.data : (ym(todayISO())===mes ? todayISO() : mes+'-01');
  view.innerHTML = `
    <h2 class="title">${l?'Editar':'Novo'} ${tipo}</h2>
    <form id="f">
      <input class="field" id="valor" inputmode="decimal" placeholder="Valor (ex.: 150,00)" value="${l?String(l.valor).replace('.',','):''}" required>
      <select class="field" id="cat">${cats.map(c=>`<option ${l&&l.categoria===c?'selected':''}>${c}</option>`).join('')}</select>
      <input class="field" id="data" type="date" value="${dataPadrao}" required>
      <input class="field" id="desc" placeholder="Descrição (opcional)" maxlength="80" value="${l?esc(l.descricao):''}">
      <button class="btn green">${l?'Salvar alterações':'Salvar '+tipo}</button>
    </form>`;
  $('#f').onsubmit = e => {
    e.preventDefault();
    const valor=parseValor($('#valor').value);
    if (!(valor>0)) return toast('Informe um valor válido.');
    const u=me(), dados={tipo, valor, categoria:$('#cat').value, data:$('#data').value, descricao:$('#desc').value.trim()};
    if (l) Object.assign(l,dados); else u.lanc.push({id:uid(),...dados});
    mes = ym(dados.data); save();
    toast(l ? `${tipo} atualizado!` : `${tipo} salvo!`); history.back();
  };
}
routes.novo = tipo => { tipo = tipo==='Ganho'?'Ganho':'Gasto'; setHeader('Adicionar '+tipo, true); formLanc(tipo); };
routes.editar = id => { const l=me().lanc.find(x=>x.id===id); if(!l) return go('historico');
  setHeader('Editar '+l.tipo, true); formLanc(l.tipo, l); };

/* ---------- Histórico ---------- */
routes.historico = () => {
  const u=me(); setHeader('Histórico', true);
  const l=doMes(u,mes).sort((a,b)=>b.data.localeCompare(a.data));
  view.innerHTML = `<h2 class="title">Histórico</h2><p class="muted">${monthLabel(mes)} · toque num lançamento para editar ou excluir</p>
    ${l.length? l.map(x=>`<div class="card item" data-id="${x.id}">
      <div><div class="cat">${esc(x.categoria)}</div><div class="desc">${fmtDate(x.data)}${x.descricao?' · '+esc(x.descricao):''}</div></div>
      <div class="val ${x.tipo==='Gasto'?'red':'green'}">${x.tipo==='Gasto'?'−':'+'} ${brl(x.valor)}</div></div>`).join('')
    : '<div class="card empty">Nenhum lançamento neste mês.</div>'}`;
  view.querySelectorAll('.item').forEach(el=>el.onclick=async()=>{
    const x=u.lanc.find(i=>i.id===el.dataset.id);
    const a=await sheet('Escolha uma opção', `${x.categoria} · ${brl(x.valor)}`,
      [{label:'Editar',value:'e',cls:'blue'},{label:'Excluir',value:'x',cls:'red'},{label:'Cancelar',value:null,cls:'slate'}]);
    if(a==='e') go('editar/'+x.id);
    if(a==='x' && await confirmar('Excluir', `Deseja excluir ${x.categoria}?`,'Excluir')){
      u.lanc=u.lanc.filter(i=>i.id!==x.id); save(); toast('Lançamento excluído'); render(); }
  });
};

/* ---------- Relatório (imprimir / salvar PDF) ---------- */
function relatorio(){
  const u=me(), t=totais(u,mes);
  const linhas=tipo=>t.lanc.filter(x=>x.tipo===tipo).sort((a,b)=>a.data.localeCompare(b.data))
    .map(x=>`<tr><td>${fmtDate(x.data)}</td><td>${esc(x.categoria)}</td><td>${esc(x.descricao)}</td><td class="r">${brl(x.valor)}</td></tr>`).join('')
    || '<tr><td colspan="4">Nenhum lançamento</td></tr>';
  $('#report').innerHTML = `
    <h1>Relatório financeiro – ${monthLabel(mes).toUpperCase()}</h1>
    <p><b>Salário mensal:</b> ${brl(u.salario)}</p>
    <h2>Ganhos</h2><table><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th class="r">Valor</th></tr>${linhas('Ganho')}</table>
    <p><b>Total de ganhos:</b> ${brl(t.ganhos)}</p>
    <h2>Gastos</h2><table><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th class="r">Valor</th></tr>${linhas('Gasto')}</table>
    <p><b>Total de gastos:</b> ${brl(t.gastos)}</p>
    <h2>Disponível para investir: ${brl(t.disponivel)}</h2><p>(salário + ganhos − gastos do mês)</p>
    <p style="color:#777;font-size:11px">Gerado pelo Meu Financeiro em ${new Date().toLocaleString('pt-BR')}</p>`;
  toast('Na janela de impressão, escolha "Salvar como PDF" ou compartilhe.');
  setTimeout(()=>window.print(),300);
}

/* ---------- Configurações ---------- */
routes.config = () => {
  const u=me(); setHeader('Configurações', true);
  view.innerHTML = `
    <h2 class="title">Configurações</h2>
    <div class="card">
      <div class="label">Salário mensal</div>
      <form id="fs"><input class="field" id="sal" inputmode="decimal" placeholder="Digite seu salário" value="${u.salario?String(u.salario).replace('.',','):''}">
      <button class="btn green">Salvar</button></form>
    </div>
    <div class="card">
      <div class="label">Backup</div>
      <p class="muted">Seus dados ficam só neste aparelho. Faça backup para não perder nada ao trocar de celular ou limpar o navegador.</p>
      <button class="btn blue" id="exp">Baixar backup</button>
      <label class="btn slate" style="display:flex;align-items:center;justify-content:center">Restaurar backup
        <input type="file" id="imp" accept="application/json,.json" hidden></label>
    </div>
    <div class="card">
      <div class="label">Conta</div>
      <p class="muted">Conectado como: ${esc(u.email)}</p>
      <p class="muted">Ao excluir sua conta, o usuário e todos os seus lançamentos e o salário são apagados deste aparelho. Essa ação não pode ser desfeita.</p>
      <button class="btn outline" id="del">Excluir minha conta</button>
    </div>`;
  $('#fs').onsubmit=e=>{ e.preventDefault(); const v=$('#sal').value.trim()===''?0:parseValor($('#sal').value);
    if(!(v>=0)) return toast('Informe um valor de salário válido.'); u.salario=v; save(); toast('Salário salvo!'); history.back(); };
  $('#exp').onclick=()=>{
    const blob=new Blob([JSON.stringify({app:'meufinanceiro',versao:1,salario:u.salario,lanc:u.lanc},null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`meufinanceiro-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
  $('#imp').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{ const d=JSON.parse(await f.text()); if(d.app!=='meufinanceiro'||!Array.isArray(d.lanc)) throw 0;
      if(!await confirmar('Restaurar backup',`Isso substitui seus dados atuais por ${d.lanc.length} lançamento(s) do backup.`,'Restaurar','blue')) return;
      u.lanc=d.lanc.filter(x=>x&&x.data&&x.tipo).map(x=>({id:x.id||uid(),tipo:x.tipo,valor:+x.valor||0,categoria:x.categoria||'Outros',data:x.data,descricao:x.descricao||''}));
      u.salario=+d.salario||0; save(); toast('Backup restaurado!'); go('dashboard');
    }catch(_){ toast('Arquivo de backup inválido.'); }
  };
  $('#del').onclick=async()=>{
    if(!await confirmar('Excluir conta','Sua conta e todos os seus lançamentos e salário serão apagados permanentemente.','Excluir')) return;
    if(!await confirmar('Confirmação final','Essa ação não pode ser desfeita. Deseja mesmo excluir sua conta?','Sim, excluir')) return;
    delete db.users[u.email]; db.session=null; save(); toast('Conta excluída'); go('login');
  };
};

/* ================= Início ================= */
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
